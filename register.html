<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Register</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center;padding-top:80px;}
input{padding:10px;margin:5px;width:220px;}
button{padding:10px;width:240px;background:#00ffcc;border:none;font-weight:bold;}
</style>
</head>
<body>

<h1>Registrierung 🧾</h1>

<input id="name" placeholder="Name"><br>
<input id="email" placeholder="E-Mail"><br>
<input id="pass" type="password" placeholder="Passwort"><br>

<button onclick="register()">Registrieren</button>

<script>
function register(){
    let user = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        pass: document.getElementById("pass").value
    };

    if(!user.name || !user.email || !user.pass){
        alert("Bitte alles ausfüllen");
        return;
    }

    localStorage.setItem("user", JSON.stringify(user));

    alert("Registriert! 🔥");
    window.location.href = "login.html";
}
</script>

</body>
</html>
