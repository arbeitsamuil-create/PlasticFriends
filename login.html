<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center;padding-top:80px;}
input{padding:10px;margin:5px;width:220px;}
button{padding:10px;width:240px;background:#00ffcc;border:none;font-weight:bold;}
</style>
</head>

<body>

<h1>Вход 👤</h1>

<input id="name" placeholder="Имя"><br>
<input id="email" placeholder="E-Mail"><br>
<input id="pass" type="password" placeholder="Пароль"><br>

<button onclick="login()">Войти</button>

<script>
function login(){

    let name = document.getElementById("name").value;

    if(name && email.value && pass.value){

        // 🔥 ВАЖНО: единый ключ
        localStorage.setItem("logged","true");
        localStorage.setItem("username", name);

        window.location.href = "index.html";

    } else {
        alert("Заполните все поля");
    }
}
</script>

</body>
</html>
