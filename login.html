<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>

<body style="background:#111;color:white;font-family:Arial;text-align:center;padding-top:80px;">

<h1>Вход 🔐</h1>

<input id="name" placeholder="Имя"><br><br>
<input id="login" placeholder="Логин"><br><br>
<input id="pass" type="password" placeholder="Пароль"><br><br>

<button onclick="go()">Войти</button>

<script>
function go(){

let name = document.getElementById("name").value;
let login = document.getElementById("login").value;
let pass = document.getElementById("pass").value;

// 🔥 твои данные
if(login === "PlasticFriends" && pass === "productkey2026" && name){

localStorage.setItem("auth","true");
localStorage.setItem("username",name);

window.location.href="index.html";

}else{
alert("❌ Неверные данные");
}

}
</script>

</body>
</html>
