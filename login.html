<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>

<body style="background:#111;color:white;text-align:center;font-family:Arial;padding-top:80px;">

<h1>Вход 🔐</h1>

<input id="login" placeholder="Логин"><br><br>
<input id="pass" type="password" placeholder="Пароль"><br><br>

<button onclick="go()">Войти</button>

<script>
function go(){

let login = document.getElementById("login").value;
let pass = document.getElementById("pass").value;

// 🔥 твои данные
if(login === "PlasticFriends" && pass === "productkey2026"){

// сохраняем вход
sessionStorage.setItem("auth","ok");

// переход
window.location.href="index.html";

}else{
alert("Неверный логин или пароль ❌");
}

}
</script>

</body>
</html>
