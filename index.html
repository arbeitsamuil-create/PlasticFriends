<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PlasticFriends</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

/* HEADER */
header{
    background:#1c1c1c;
    padding:20px;
    text-align:center;
}

/* СЕТКА ТОВАРОВ */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
    padding:40px;
}

/* КАРТОЧКИ */
.card{
    background:#1b1b1b;
    padding:15px;
    width:220px;
    border-radius:12px;
    transition:0.3s;
    transform:scale(1);
    text-align:center;
}

/* 🔥 ЭФФЕКТ ПРИБЛИЖЕНИЯ */
.card:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px rgba(0,255,204,0.5);
}

/* КНОПКИ */
button{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#00ffcc;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

/* КОРЗИНА */
.cart{
    background:#1c1c1c;
    padding:20px;
    margin:20px;
    border-radius:10px;
}

/* ССЫЛКА */
a{
    color:#00ffcc;
}
</style>
</head>

<body>

<!-- 🔐 защита входа -->
<script>
if(localStorage.getItem("logged") !== "yes"){
    window.location.href="login.html";
}
</script>

<header>
<h2>PlasticFriends 🛍</h2>

👋 Привет, <span id="user"></span>

<button onclick="logout()" style="width:120px;">Выйти</button>

<a href="admin-login.html" style="margin-left:10px;">Админ панель</a>
</header>

<!-- ТОВАРЫ -->
<div class="container">

<div class="card">
<h3>Брелок</h3>
<p>3€</p>
<button onclick="addToCart('Брелок',3)">Купить</button>
</div>

<div class="card">
<h3>Браслет</h3>
<p>5€</p>
<button onclick="addToCart('Браслет',5)">Купить</button>
</div>

<div class="card">
<h3>Головоломка</h3>
<p>8€</p>
<button onclick="addToCart('Головоломка',8)">Купить</button>
</div>

</div>

<!-- КОРЗИНА -->
<div class="cart">

<h2>Корзина 🛒</h2>
<div id="cart"></div>

<p>Итого: <span id="total">0</span>€</p>

<button onclick="order()">Оформить заказ</button>

<hr>

<h3>Мои заказы 📦</h3>
<div id="orders"></div>

</div>

<script>

let cart = [];

// имя
document.getElementById("user").innerText =
localStorage.getItem("username");

// выход
function logout(){
localStorage.clear();
window.location.href="login.html";
}

// добавить в корзину
function addToCart(name,price){
cart.push({name,price});
renderCart();
}

// показать корзину
function renderCart(){
let total = 0;
cartDiv.innerHTML = "";

cart.forEach(i=>{
total += i.price;
cartDiv.innerHTML += `<p>${i.name} - ${i.price}€</p>`;
});

totalEl.innerText = total;
}

// заказ
function order(){

if(cart.length == 0){
alert("Корзина пустая");
return;
}

let orders = JSON.parse(localStorage.getItem("orders") || "[]");

orders.push({
items: cart,
status: "готовится"
});

localStorage.setItem("orders", JSON.stringify(orders));

cart = [];
renderCart();
loadOrders();
}

// показать заказы
function loadOrders(){

let orders = JSON.parse(localStorage.getItem("orders") || "[]");

ordersDiv.innerHTML = "";

orders.forEach((o,i)=>{
ordersDiv.innerHTML += `
<div style="background:#111;padding:10px;margin:10px;border-radius:10px">
<b>Заказ ${i+1}</b><br>
${o.items.map(x=>x.name+" "+x.price+"€").join("<br>")}<br>
<b>${o.status}</b>
</div>
`;
});

}

loadOrders();

</script>

</body>
</html>
