<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PlasticFriends</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

header{
    background:#1c1c1c;
    padding:15px;
    text-align:center;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.card{
    background:#1b1b1b;
    width:200px;
    margin:10px;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:8px;
    background:#00ffcc;
    border:none;
    margin-top:5px;
    cursor:pointer;
    font-weight:bold;
}

.cart{
    background:#1c1c1c;
    padding:15px;
    margin:20px;
}
</style>
</head>

<body>

<!-- 🔐 ЗАЩИТА ВХОДА -->
<script>
if(localStorage.getItem("logged") !== "true"){
    window.location.href = "login.html";
}
</script>

<header>

<h2>PlasticFriends 🛍</h2>

👋 Hallo, <span id="user"></span>

<button onclick="logout()">Выйти</button>

</header>

<div class="container">

<div class="card">
Брелок 3€
<button onclick="add('Брелок',3)">Купить</button>
</div>

<div class="card">
Браслет 5€
<button onclick="add('Браслет',5)">Купить</button>
</div>

<div class="card">
Головоломка 8€
<button onclick="add('Головоломка',8)">Купить</button>
</div>

</div>

<div class="cart">

<h2>Корзина 🛒</h2>
<div id="cart"></div>
<p>Итого: <span id="total">0</span>€</p>

<button onclick="order()">Оформить заказ</button>

<hr>

<h3>Мои заказы 📦</h3>
<div id="orders"></div>

</div>

<script>

let cart = [];

// имя
document.getElementById("user").innerText =
localStorage.getItem("username");

// выход
function logout(){
    localStorage.clear();
    window.location.href="login.html";
}

// добавить в корзину
function add(name,price){
    cart.push({name,price});
    render();
}

// корзина
function render(){
    let total = 0;
    cartDiv.innerHTML = "";

    cart.forEach(i=>{
        total += i.price;
        cartDiv.innerHTML += `<p>${i.name} - ${i.price}€</p>`;
    });

    totalEl.innerText = total;
}

// заказ
function order(){

    if(cart.length==0){
        alert("Корзина пустая");
        return;
    }

    let orders = JSON.parse(localStorage.getItem("orders")||"[]");

    orders.push({
        items:cart,
        status:"готовится"
    });

    localStorage.setItem("orders",JSON.stringify(orders));

    cart = [];
    render();
    loadOrders();
}

// показать заказы
function loadOrders(){

    let orders = JSON.parse(localStorage.getItem("orders")||"[]");

    ordersDiv.innerHTML = "";

    orders.forEach((o,i)=>{

        ordersDiv.innerHTML += `
        <div style="background:#111;margin:10px;padding:10px">
        <b>Заказ ${i+1}</b><br>
        ${o.items.map(x=>x.name+" "+x.price+"€").join("<br>")}<br>
        <b>${o.status}</b>
        </div>
        `;
    });
}

loadOrders();

</script>

</body>
</html>
