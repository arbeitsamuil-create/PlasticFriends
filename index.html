<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PlasticFriends</title>
</head>

<body style="background:#0f0f0f;color:white;font-family:Arial;">

<h1>PlasticFriends 🛍</h1>

<!-- имя -->
<input id="username" placeholder="Введите имя"><br><br>

<!-- товары -->
<button onclick="add('Брелок',3)">Брелок 3€</button>
<button onclick="add('Браслет',5)">Браслет 5€</button>

<hr>

<h2>Корзина</h2>
<div id="cart"></div>

<p>Итого: <span id="total">0</span>€</p>

<button onclick="order()">Оформить заказ</button>

<hr>

<h2>Заказы</h2>
<div id="orders"></div>

<script>

let cart=[];

// добавить
function add(name,price){
cart.push({name,price});
render();
}

// корзина
function render(){
let total=0;
document.getElementById("cart").innerHTML="";

cart.forEach(i=>{
total+=i.price;
document.getElementById("cart").innerHTML+=
`<p>${i.name} - ${i.price}€</p>`;
});

document.getElementById("total").innerText=total;
}

// заказ
function order(){

let name=document.getElementById("username").value;

if(!name){
alert("Введите имя");
return;
}

if(cart.length==0){
alert("Корзина пустая");
return;
}

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

orders.push({
user:name,
items:cart,
status:"готовится"
});

localStorage.setItem("orders",JSON.stringify(orders));

cart=[];
render();
loadOrders();
}

// показать
function loadOrders(){

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

document.getElementById("orders").innerHTML="";

orders.forEach(o=>{
document.getElementById("orders").innerHTML+=`
<div style="background:#222;margin:10px;padding:10px">
👤 ${o.user}<br>
${o.items.map(x=>x.name+" "+x.price+"€").join("<br>")}<br>
<b>${o.status}</b>
</div>
`;
});

}

loadOrders();

</script>

</body>
</html>
