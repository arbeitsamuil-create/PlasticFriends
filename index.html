<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PlasticFriends Shop</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    background:#1c1c1c;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.card{
    background:#1b1b1b;
    width:200px;
    margin:10px;
    padding:10px;
    border-radius:10px;
}

button{
    width:100%;
    padding:8px;
    background:#00ffcc;
    border:none;
    margin-top:5px;
    cursor:pointer;
    font-weight:bold;
}

.cart{
    background:#1c1c1c;
    padding:15px;
    margin:20px;
}

a{color:#00ffcc;}
</style>
</head>

<body>

<header>
<h1>PlasticFriends 🛍</h1>
</header>

<div class="container">

<div class="card">
<h3>Брелок</h3>
<p>3€</p>
<button onclick="add('Брелок',3)">Купить</button>
</div>

<div class="card">
<h3>Браслет</h3>
<p>5€</p>
<button onclick="add('Браслет',5)">Купить</button>
</div>

<div class="card">
<h3>3D головоломка</h3>
<p>8€</p>
<button onclick="add('Головоломка',8)">Купить</button>
</div>

</div>

<div class="cart">

<h2>Корзина 🛒</h2>
<div id="cart"></div>
<p>Итого: <span id="total">0</span>€</p>

<button onclick="order()">Оформить заказ</button>

<hr>

<h2>Мои заказы 📦</h2>
<div id="orders"></div>

</div>

<script>

let cart = [];

// добавление товара
function add(name, price){
    cart.push({name, price});
    render();
}

// корзина
function render(){
    let c = document.getElementById("cart");
    let total = 0;
    c.innerHTML = "";

    cart.forEach(i=>{
        total += i.price;
        c.innerHTML += "<p>"+i.name+" - "+i.price+"€</p>";
    });

    document.getElementById("total").innerText = total;
}

// создать заказ
function order(){

    if(cart.length == 0){
        alert("Корзина пустая");
        return;
    }

    let orders = JSON.parse(localStorage.getItem("orders") || "[]");

    orders.push({
        items: cart,
        status: "готовится"
    });

    localStorage.setItem("orders", JSON.stringify(orders));

    cart = [];
    render();
    loadOrders();
}

// показать заказы + чек
function loadOrders(){

    let orders = JSON.parse(localStorage.getItem("orders") || "[]");
    let out = document.getElementById("orders");

    out.innerHTML = "";

    orders.forEach((o,i)=>{

        let html = "<div style='background:#111;padding:10px;margin:10px;border-radius:10px'>";
        html += "<b>Заказ #" + (i+1) + "</b><br>";

        o.items.forEach(it=>{
            html += it.name + " - " + it.price + "€<br>";
        });

        html += "<br><b>Статус:</b> " + o.status;
        html += "</div>";

        out.innerHTML += html;
    });
}

loadOrders();

</script>

    <script>

// защита входа
if(localStorage.getItem("user") !== "true"){
    window.location.href = "login.html";
}

// имя пользователя (если есть)
let savedName = localStorage.getItem("username") || "Gast";
document.getElementById("userName").innerText = savedName;

// выйти из аккаунта
function logout(){
    localStorage.removeItem("user");
    localStorage.removeItem("username");
    window.location.href = "login.html";
}

</script>
</body>
</html>
