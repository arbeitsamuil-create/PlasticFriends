<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PlasticFriends</title>
<style>
body{background:#0f0f0f;color:white;font-family:Arial;margin:0;}
header{background:#1c1c1c;padding:15px;text-align:center;}
button{padding:8px;background:#00ffcc;border:none;font-weight:bold;cursor:pointer;}
.card{background:#1b1b1b;padding:10px;margin:10px;width:200px;}
.container{display:flex;flex-wrap:wrap;justify-content:center;}
.cart{background:#1c1c1c;padding:15px;margin:20px;}
</style>
</head>

<body>

<!-- 🔐 проверка логина -->
<script>
if(localStorage.getItem("logged") !== "yes"){
    window.location.href="login.html";
}
</script>

<header>
<h2>PlasticFriends 🛍</h2>

👋 Привет, <span id="user"></span>

<button onclick="logout()">Выйти</button>

</header>

<div class="container">

<div class="card">
Брелок 3€
<button onclick="add('Брелок',3)">Купить</button>
</div>

<div class="card">
Браслет 5€
<button onclick="add('Браслет',5)">Купить</button>
</div>

</div>

<div class="cart">

<h3>Корзина 🛒</h3>
<div id="cart"></div>

<p>Итого: <span id="total">0</span>€</p>

<button onclick="order()">Заказать</button>

<hr>

<h3>Заказы 📦</h3>
<div id="orders"></div>

</div>

<script>

let cart=[];

document.getElementById("user").innerText =
localStorage.getItem("username");

// выход
function logout(){
localStorage.clear();
window.location.href="login.html";
}

// добавить
function add(n,p){
cart.push({name:n,price:p});
render();
}

// корзина
function render(){
let t=0;
cartDiv.innerHTML="";
cart.forEach(i=>{
t+=i.price;
cartDiv.innerHTML+=`<p>${i.name} ${i.price}€</p>`;
});
total.innerText=t;
}

// заказ
function order(){

if(cart.length==0){
alert("Пусто");
return;
}

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

orders.push({
items:cart,
status:"готовится"
});

localStorage.setItem("orders",JSON.stringify(orders));

cart=[];
render();
loadOrders();
}

// показать заказы
function loadOrders(){

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

ordersDiv.innerHTML="";

orders.forEach((o,i)=>{
ordersDiv.innerHTML+=
`<div style="background:#111;padding:10px;margin:10px">
Заказ ${i+1}<br>
${o.items.map(x=>x.name+" "+x.price+"€").join("<br>")}
<br><b>${o.status}</b>
</div>`;
});

}

loadOrders();

</script>

</body>
</html>
