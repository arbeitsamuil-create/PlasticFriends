<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PlasticFriends</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

header{
background:#1c1c1c;
padding:20px;
text-align:center;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:25px;
padding:40px;
}

.card{
background:#1b1b1b;
padding:15px;
width:220px;
border-radius:12px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:scale(1.08);
box-shadow:0 0 20px rgba(0,255,204,0.4);
}

button{
width:100%;
padding:10px;
margin-top:10px;
background:#00ffcc;
border:none;
font-weight:bold;
cursor:pointer;
}

.cart{
background:#1c1c1c;
padding:20px;
margin:20px;
border-radius:10px;
}
</style>
</head>

<body>

<!-- 🔐 защита -->
<script>
if(localStorage.getItem("auth") !== "true"){
window.location.href="login.html";
}
</script>

<header>
<h2>PlasticFriends 🛍</h2>
<button onclick="logout()">Выйти</button>
</header>

<!-- ТОВАРЫ -->
<div class="container">

<div class="card">
<h3>Брелок</h3>
<p>3€</p>
<button onclick="add('Брелок',3)">Купить</button>
</div>

<div class="card">
<h3>Браслет</h3>
<p>5€</p>
<button onclick="add('Браслет',5)">Купить</button>
</div>

<div class="card">
<h3>Головоломка</h3>
<p>8€</p>
<button onclick="add('Головоломка',8)">Купить</button>
</div>

</div>

<!-- КОРЗИНА -->
<div class="cart">

<h2>Корзина 🛒</h2>
<div id="cart"></div>

<p>Итого: <span id="total">0</span>€</p>

<button onclick="order()">Оформить заказ</button>

<hr>

<h3>Заказы 📦</h3>
<div id="orders"></div>

</div>

<script>

let cart=[];

// выход
function logout(){
localStorage.clear();
window.location.href="login.html";
}

// добавить товар
function add(name,price){
cart.push({name,price});
render();
}

// корзина (ИСПРАВЛЕНО)
function render(){

let total=0;

document.getElementById("cart").innerHTML="";

cart.forEach(i=>{
total+=i.price;
document.getElementById("cart").innerHTML+=
`<p>${i.name} - ${i.price}€</p>`;
});

document.getElementById("total").innerText=total;
}

// оформить заказ
function order(){

if(cart.length==0){
alert("Корзина пустая");
return;
}

let user = "User";

let orders = JSON.parse(localStorage.getItem("orders")||"[]");

orders.push({
user:user,
items:cart,
status:"готовится"
});

localStorage.setItem("orders",JSON.stringify(orders));

cart=[];
render();
loadOrders();
}

// показать заказы
function loadOrders(){

let orders = JSON.parse(localStorage.getItem("orders")||"[]");

document.getElementById("orders").innerHTML="";

orders.forEach((o,i)=>{
document.getElementById("orders").innerHTML+=`
<div style="background:#111;padding:10px;margin:10px;border-radius:10px">
<b>👤 ${o.user}</b><br>
${o.items.map(x=>x.name+" "+x.price+"€").join("<br>")}<br>
<b>${o.status}</b>
</div>`;
});

}

loadOrders();

</script>

</body>
</html>
