<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center;padding-top:80px;}
input{padding:10px;margin:5px;width:220px;}
button{padding:10px;width:240px;background:#00ffcc;border:none;font-weight:bold;}
</style>
</head>

<body>

<h1>Вход 👤</h1>

<input id="name" placeholder="Имя"><br><br>

<button onclick="login()">Войти</button>

<script>
function login(){

let name = document.getElementById("name").value;

if(name){

localStorage.setItem("logged","yes");
localStorage.setItem("username",name);

window.location.href="index.html";

}else{
alert("Введите имя");
}

}
</script>

</body>
</html>
